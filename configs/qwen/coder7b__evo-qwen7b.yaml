# Qwen benchmark profile (Venkat). Derived from config.yaml with a lighter budget so one arm
# finishes in ~2-4 h on an M4 Pro: 4 rounds x 30 episodes, test sets scored at rounds 0 and 4,
# 30-task edit probes. Solver = qwen2.5-coder:7b; evolver = qwen2.5-coder:7b.
# Run:  python run.py --arm guarded --config configs/qwen/coder7b__evo-qwen7b.yaml --name coder7b__evo-qwen7b__guarded
# Intended arms: guarded|unguarded|append_only|gate_only
seed: 0
rounds: 4
batch_size: 30
workers: 2
eval_every: 4
runs_dir: runs
data:
  task_files:
  - data/processed/bird.jsonl
  - data/processed/spider.jsonl
  splits_file: data/processed/splits.json
  train: bird:train
  val: bird:val
  test:
    bird_test: bird:test
    spider_transfer:
      split: spider:test
      max: 200
llm:
  host: http://localhost:11434
  solver: qwen2.5-coder:7b
  evolver: qwen2.5-coder:7b
  cache: data/cache/llm_cache.sqlite
  solver_ctx: 8192
  evolver_ctx: 16384
solver:
  top_k: 3
  min_score: 0.5
  repair: true
  sql_timeout: 30
evolver:
  max_ops: 4
  n_fail: 10
  n_success: 3
  show_gold: true
monitor:
  probe_relevant: 20
  probe_random: 10
  min_net: 2
  alpha: 0.05
  min_uses: 5
  loo: true
  loo_max_tasks: 8
  rollback_min_net: 3
  audit_split: bird_test
