# LoRA SFT for mlx-community/Qwen2.5-Coder-7B-Instruct-4bit (QLoRA: 4-bit base, LoRA rank 16 on the last 16 layers).
# Train : mlx_lm.lora -c finetune/configs/coder7b_r16.yaml
# Serve : mlx_lm.server --model mlx-community/Qwen2.5-Coder-7B-Instruct-4bit --adapter-path finetune/adapters/coder7b-r16 --port 8080
# Eval  : python -m bench.run --model mlx:coder7b-r16 --rungs ms_rules,ms_fs3
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
data: finetune/data/ms_rules
adapter_path: finetune/adapters/coder7b-r16
mask_prompt: true
num_layers: 16
batch_size: 2
grad_accumulation_steps: 4
iters: 800
learning_rate: 0.0001
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments:
  - 0.0001
  - 800
  - 1.0e-06
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
max_seq_length: 4096
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 100
val_batches: 15
save_every: 200
seed: 0
